name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project (Repo files or Zip)
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Unzipping: $ZIP"
            mkdir -p proj
            unzip -q -o "$ZIP" -d proj
            SEARCH=proj
          else
            SEARCH=.
          fi
          
          GRADLEW=$(find "$SEARCH" -maxdepth 3 -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then 
            echo "Error: gradlew not found. Is this an Android project?"
            exit 1 
          fi
          
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect and Rename APK
        run: |
          mkdir -p out
          # বিল্ড হওয়া APK খুঁজে বের করা
          APK=$(find . -type f -name '*.apk' | grep 'debug' | head -n 1)
          if [ -z "$APK" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          cp "$APK" out/app.apk
          echo "APK successfully copied to out/app.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: out/app.apk

      - name: Publish Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "App Debug Build #${{ github.run_number }}"
          files: out/app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
